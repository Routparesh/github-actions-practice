name: lint check

on:
  push:
    branches:
      - 'master'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.8

      - name: Install Python dependencies
        run: pip install black flake8 pylint

      - uses: actions/checkout@v2
      - uses: wearerequired/lint-action@v3
        with:
          pylint: true
          black: true
          flake8: true
